<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bike Details Upload System</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; background: #f7f7f9; }
    h1, h2 { color: #1c2a3a; }
    .card { background: white; padding: 1rem 1.25rem; border-radius: 8px; margin-bottom: 1rem; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    form { display: grid; gap: 0.5rem; }
    input, select, button, textarea { padding: 0.55rem; border-radius: 6px; border: 1px solid #ccc; }
    button { cursor: pointer; background: #005bd3; color: white; border: none; font-weight: 600; }
    button:disabled { background: #8a99ad; cursor: not-allowed; }
    pre { background: #0f1720; color: #e8eef4; padding: 0.75rem; border-radius: 6px; overflow-x: auto; }
    .status { font-size: 0.9rem; color: #0b7a39; min-height: 1.2rem; }
  </style>
</head>
<body>
  <h1>🚲 Bike Details Upload & Manual Entry System</h1>

  <section class="card">
    <h2>Manual Bike Entry</h2>
    <form id="manual-bike-form">
      <input name="bike_number" placeholder="Bike Number" required />
      <input name="model_name" placeholder="Model Name" required />
      <input name="engine_number" placeholder="Engine Number" />
      <input name="chassis_number" placeholder="Chassis Number" />
      <input name="mfg_date" type="date" />
      <input name="color" placeholder="Color" />
      <select name="status">
        <option>Production</option>
        <option>Testing</option>
        <option>Completed</option>
      </select>
      <button id="save-bike-btn" type="submit">Save Bike Details</button>
      <div class="status" id="manual-status"></div>
    </form>
  </section>

  <section class="card">
    <h2>Upload Bike Data Excel (.xlsx)</h2>
    <form id="excel-form" enctype="multipart/form-data">
      <input type="file" name="file" accept=".xlsx,.xls" required />
      <button id="save-excel-btn" type="submit">Save Excel Details</button>
      <div class="status" id="excel-status"></div>
    </form>
  </section>

  <section class="card">
    <h2>Add Testing Record</h2>
    <form id="testing-form">
      <input name="bike_id" type="number" placeholder="Bike ID" required />
      <input name="test_type" placeholder="Test Type" required />
      <input name="test_date" type="date" />
      <input name="result" placeholder="Result" />
      <textarea name="remarks" placeholder="Remarks"></textarea>
      <button id="save-testing-btn" type="submit">Save Testing Details</button>
      <div class="status" id="testing-status"></div>
    </form>
  </section>

  <section class="card">
    <h2>Add Modification Record</h2>
    <form id="modification-form">
      <input name="bike_id" type="number" placeholder="Bike ID" required />
      <input name="part_name" placeholder="Part Name" required />
      <input name="old_version" placeholder="Old Version" />
      <input name="new_version" placeholder="New Version" />
      <textarea name="reason" placeholder="Reason"></textarea>
      <input name="change_date" type="date" />
      <button id="save-modification-btn" type="submit">Save Modification Details</button>
      <div class="status" id="modification-status"></div>
    </form>
  </section>

  <section class="card">
    <h2>Upload Bike Document</h2>
    <form id="document-form" enctype="multipart/form-data">
      <input name="bike_id" type="number" placeholder="Bike ID" required />
      <input name="document_name" placeholder="Document Name" required />
      <input name="document_type" placeholder="Document Type (PDF/Report/etc.)" />
      <input type="file" name="document_file" required />
      <button id="save-document-btn" type="submit">Save Document</button>
      <div class="status" id="document-status"></div>
    </form>
  </section>

  <section class="card">
    <h2>Search Full Bike Record</h2>
    <form id="search-form">
      <input name="bike_number" placeholder="Bike Number" required />
      <button id="search-btn" type="submit">Search Saved Details</button>
      <div class="status" id="search-status"></div>
    </form>
  </section>

  <section class="card">
    <h2>Result</h2>
    <pre id="result">No actions yet.</pre>
  </section>

  <script>
    const result = document.getElementById('result');

    const show = (data) => {
      result.textContent = JSON.stringify(data, null, 2);
    };

    const withButtonState = async (buttonId, statusId, actionText, fn) => {
      const button = document.getElementById(buttonId);
      const status = document.getElementById(statusId);
      button.disabled = true;
      status.textContent = `${actionText}...`;
      try {
        const responseData = await fn();
        status.textContent = 'Saved successfully.';
        show(responseData);
      } catch (error) {
        status.textContent = `Error: ${error.message}`;
        show({ error: error.message });
      } finally {
        button.disabled = false;
      }
    };

    async function parseResponse(response) {
      const payload = await response.json();
      if (!response.ok) {
        throw new Error(payload.error || 'Request failed');
      }
      return payload;
    }

    document.getElementById('manual-bike-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      await withButtonState('save-bike-btn', 'manual-status', 'Saving bike details', async () => {
        const body = Object.fromEntries(new FormData(event.target).entries());
        const response = await fetch('/api/bikes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const payload = await parseResponse(response);
        event.target.reset();
        return payload;
      });
    });

    document.getElementById('excel-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      await withButtonState('save-excel-btn', 'excel-status', 'Saving excel details', async () => {
        const formData = new FormData(event.target);
        const response = await fetch('/api/bikes/upload-excel', {
          method: 'POST',
          body: formData
        });
        const payload = await parseResponse(response);
        event.target.reset();
        return payload;
      });
    });

    document.getElementById('testing-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      await withButtonState('save-testing-btn', 'testing-status', 'Saving testing details', async () => {
        const body = Object.fromEntries(new FormData(event.target).entries());
        const response = await fetch('/api/testing', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const payload = await parseResponse(response);
        event.target.reset();
        return payload;
      });
    });

    document.getElementById('modification-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      await withButtonState('save-modification-btn', 'modification-status', 'Saving modification details', async () => {
        const body = Object.fromEntries(new FormData(event.target).entries());
        const response = await fetch('/api/modifications', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const payload = await parseResponse(response);
        event.target.reset();
        return payload;
      });
    });

    document.getElementById('document-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      await withButtonState('save-document-btn', 'document-status', 'Saving document', async () => {
        const formData = new FormData(event.target);
        const bikeId = formData.get('bike_id');
        formData.delete('bike_id');
        const response = await fetch(`/api/bikes/${bikeId}/documents`, {
          method: 'POST',
          body: formData
        });
        const payload = await parseResponse(response);
        event.target.reset();
        return payload;
      });
    });

    document.getElementById('search-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      await withButtonState('search-btn', 'search-status', 'Loading saved details', async () => {
        const bikeNumber = new FormData(event.target).get('bike_number');
        const response = await fetch(`/api/bikes/search?bike_number=${encodeURIComponent(bikeNumber)}`);
        return parseResponse(response);
      });
    });
  </script>
</body>
</html>
